<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="64x64" href="{{ site.baseurl }}/{% ministamp /assets/images/wappen-kultur-heimatverein-gondorf-favicon.png assets/favicon.png %}">
  <link rel="apple-touch-icon" sizes="64x64" href="{{ site.baseurl }}/{% ministamp /assets/images/wappen-kultur-heimatverein-gondorf-favicon.png assets/favicon.png %}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:locale" content="de_DE">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/{% ministamp /assets/images/wappen-kultur-heimatverein-gondorf.png assets/logo.png %}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="{{ site.baseurl }}/{% ministamp /assets/css/main.css assets/main.css %}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% if page.url == '/' %}
  <script type="application/ld+json">{
    "@context":"https://schema.org","@type":"Organization","name":{{ site.title | jsonify }},"url":{{ site.url | append: site.baseurl | jsonify }},"description":{{ site.description | strip_newlines | jsonify }},"email":{{ site.data.site.email | jsonify }},"telephone":{{ site.data.site.phone | jsonify }},"address":{"@type":"PostalAddress","streetAddress":{{ site.data.site.address | jsonify }},"postalCode":{{ site.data.site.postal_code | jsonify }},"addressLocality":{{ site.data.site.city | jsonify }},"addressCountry":"DE"}
  }</script>
  {% endif %}
</head>
