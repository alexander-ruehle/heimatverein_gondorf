{% assign upcoming = site.termine | sort: 'date' %}<div class="event-list">{% for event in upcoming %}<article class="event-item"><time datetime="{{ event.date | date: '%Y-%m-%d' }}"><span>{{ event.date | date: '%d' }}</span>{{ event.date | date: '%b %Y' }}</time><div><h3><a href="{{ event.url | relative_url }}">{{ event.title }}</a></h3>{% if event.location %}<p>{{ event.location }}</p>{% endif %}</div></article>{% endfor %}</div>
